<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09whl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        /*图表标题样式，放在box上方*/
        .title{
            text-align:center;
            font-size:22px;
            margin-bottom:20px;
        }
        .box {
            display: flex;
            width: 700px;
            height: 300px;
            border-left: 1px solid pink;
            border-bottom: 1px solid pink;
            margin: 50px auto;
            justify-content: space-around;
            align-items: flex-end;
            text-align: center;
        }
        .box>div {
            display: flex;
            width: 50px;
            background-color: pink;
            flex-direction: column;
            justify-content: space-between;
        }
        .box div span {
            margin-top: -20px;
        }
        .box div h4 {
            margin-bottom: -35px;
            width: 70px;
            margin-left: -10px;
        }
    </style>
</head>
<body>

<script>
        let arr = [];
    for(let i = 0;i < 4 ;i++){
        let inputStr = prompt(`请输入第${i+1}季度的销量(0‑300)`);
        //点击取消
        if(inputStr === null){
            alert("取消输入，图表不再生成");
            break;
        }
        //空输入、非数字、负数、超过最大值都判定非法
        let num = Number(inputStr);
        if(inputStr === "" || isNaN(num) || num < 0 || num > 300){
            alert("不能为空，请输入0‑300之间有效数字！");
            i--;
        }else{
            arr.push(num);
        }
    }
    if(arr.length === 4){
        console.log(arr)
        document.write(`
            <div class="title">王慧琳的柱状图</div>
        `)
        document.write(`
        <div class="box">
        `)
        for(let i = 0;i < arr.length;i++){
            document.write(`
                <div style="height: ${arr[i]}px;">
                    <span>${arr[i]}px</span>
                    <h4>第${i + 1}季度</h4>
                </div>
            `)
        }
        document.write(`
        </div>
        `)
    }

</script>
</body>
</html>
