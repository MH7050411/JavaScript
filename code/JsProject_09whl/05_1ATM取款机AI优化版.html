<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM取款机_09whl</title>
</head>
<body>
<script>
    // 初始余额
    let money = 1000;
    while(true){
        let re = +prompt("请选择:\n1.取款\n2.存款\n3.查询余额\n4.退出");
        // 判断用户是否点取消
        if(isNaN(re)){
            alert("输入无效，退出程序");
            break;
        }
        if(re === 4){
            alert("感谢使用，再见！");
            break;
        }
        switch(re){
            case 1:
                let qu = +prompt("请输入取款金额：");
                if(isNaN(qu) || qu <=0){
                    alert("请输入合法正数！");
                }else if(qu > money){
                    alert("余额不足！");
                }else{
                    money = money - qu;
                    alert(`取款成功！当前余额：${money}`);
                }
                break;
            case 2:
                let cun = +prompt("请输入存款金额：");
                if(isNaN(cun) || cun <=0){
                    alert("请输入合法正数！");
                }else{
                    money = money + cun;
                    alert(`存款成功！当前余额：${money}`);
                }
                break;
            case 3:
                alert(`余额为：${money}`);
                break;
            default:
                alert("输入选项错误，请输入1-4");
                break;
        }
    }
</script>
</body>
</html>
