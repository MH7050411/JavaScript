<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轮播图点击切换</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .slider {
      width: 560px;
      height: 400px;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(100, 67, 68);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="./images/slider01.jpg" alt="" />
    </div>
    <div class="slider-footer">
      <p>对人类来说会不会太超前了？</p>
      <ul class="slider-indicator">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>
  <script>
    // 1. 初始数据
    const sliderData = [
      { url: './images/slider01.jpg', title: '王慧琳对人类来说会不会太超前了？', color: 'rgb(100, 67, 68)' },
      { url: './images/slider02.jpg', title: '王慧琳开启剑与雪的黑暗传说！', color: 'rgb(43, 35, 26)' },
      { url: './images/slider03.jpg', title: '王慧琳真正的jo厨出现了！', color: 'rgb(36, 31, 33)' },
      { url: './images/slider04.jpg', title: '王慧琳李玉刚：让世界通过B站看到东方大国文化', color: 'rgb(139, 98, 66)' },
      { url: './images/slider05.jpg', title: '王慧琳快来分享你的寒假日常吧~', color: 'rgb(67, 90, 92)' },
      { url: './images/slider06.jpg', title: '王慧琳哔哩哔哩小年YEAH', color: 'rgb(166, 131, 143)' },
      { url: './images/slider07.jpg', title: '王慧琳一站式解决你的电脑配置问题！！！', color: 'rgb(53, 29, 25)' },
      { url: './images/slider08.jpg', title: '王慧琳谁不想和小猫咪贴贴呢！', color: 'rgb(99, 72, 114)' },
    ]
    
    // 2.获取元素
    // 2.1图片
    const pic = document.querySelector('.slider-wrapper img')
    // 2.2文字
    const txt = document.querySelector('.slider-footer p')
    // 2.3盒子
    const box = document.querySelector('.slider-footer')
    // 2.4小圆点
    const lis = document.querySelectorAll('.slider-indicator li')
    
    let i = 0
    let id = setInterval(function(){
      i++
      if(i === sliderData.length){
        i = 0
      }
      // 3.修改元素
      // 3.1修改图片
      pic.src = sliderData[i].url
      // 3.2修改文字
      txt.innerHTML = sliderData[i].title
      // 3.3修改盒子
      box.style.background = sliderData[i].color
      // 3.4修改小圆点
      // 先删后加————排他思维
      // lis[ram].className = 'active'
      // 激活的小圆点
      const jiHuo = document.querySelector('.active')
      // console.log(jiHuo)
      jiHuo.classList.remove('active')
      lis[i].classList.add('active')

      // console.log(i)
    },1000)

    // 获取按钮
    const btn1 = document.querySelector('.prev')
    console.log(btn1)
    const btn2 = document.querySelector('.next')
    console.log(btn2)

    // 给向右按钮添加事件
    btn2.addEventListener('click', function () {
      i++
      if(i === sliderData.length){
        i = 0
      }
      pic.src = sliderData[i].url
      // 3.2修改文字
      txt.innerHTML = sliderData[i].title
      // 3.3修改盒子
      box.style.background = sliderData[i].color
      // 3.4修改小圆点
      // 先删后加————排他思维
      // lis[ram].className = 'active'
      // 激活的小圆点
      const jiHuo = document.querySelector('.active')
      // console.log(jiHuo)
      jiHuo.classList.remove('active')
      lis[i].classList.add('active')
    })

    // 给向左按钮添加事件
    btn1.addEventListener('click', function () { 
      i--
      if(i < 0){
        i = sliderData.length - 1
      }
      // i=i<0?sliderData.length-1:i
      pic.src = sliderData[i].url
      // 3.2修改文字
      txt.innerHTML = sliderData[i].title
      // 3.3修改盒子
      box.style.background = sliderData[i].color
      // 3.4修改小圆点
      // 先删后加————排他思维
      // lis[ram].className = 'active'
      // 激活的小圆点
      const jiHuo = document.querySelector('.active')
      // console.log(jiHuo)
      jiHuo.classList.remove('active')
      lis[i].classList.add('active')
})


    // 获取大盒子
    const bigBox = document.querySelector('.slider')
    console.log(bigBox)
    bigBox.addEventListener('mouseenter', function () { 
      clearInterval(id)
})

  bigBox.addEventListener('mouseleave', function () { 
    // console.log(44)
      id = setInterval(function(){
      i++
      if(i === sliderData.length){
        i = 0
      }
      // 3.修改元素
      // 3.1修改图片
      pic.src = sliderData[i].url
      // 3.2修改文字
      txt.innerHTML = sliderData[i].title
      // 3.3修改盒子
      box.style.background = sliderData[i].color
      // 3.4修改小圆点
      // 先删后加————排他思维
      // lis[ram].className = 'active'
      // 激活的小圆点
      const jiHuo = document.querySelector('.active')
      // console.log(jiHuo)
      jiHuo.classList.remove('active')
      lis[i].classList.add('active')

      // console.log(i)
    },1000)
})


    
  </script>
</body>

</html>
