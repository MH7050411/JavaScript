<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字文创作品登记系统</title>
    <style>
        table{border-collapse: collapse; margin:10px 0;}
        td,th{border:1px solid #333; padding:5px 10px;}
    </style>
</head>
<body>
    <h2>数字文创作品登记系统</h2>
    <button id="addBtn">批量录入作品</button>
    <div id="box"></div>
    <script>
        // 数组：用来保存所有作品数据
        let workList = [];

        // 获取按钮和容器
        let addBtn = document.getElementById('addBtn');
        let box = document.getElementById('box');

        // 点击按钮批量录入
        addBtn.onclick = function(){
            // 循环录入，输入0停止录入
            while(true){
                let name = prompt("输入作者姓名（输入0结束录入）");
                if(name === '0') break;
                
                let age = +prompt("输入作者年龄");
                let title = prompt("输入作品名称");

                // 判断年龄，得到创作者等级
                let level;
                if(age < 25){
                    level = "初级创作者";
                }else if(age <=40){
                    level = "进阶创作者";
                }else{
                    level = "资深创作者";
                }

                // 把一条数据放进数组
                workList.push({
                    name: name,
                    age: age,
                    title: title,
                    level: level
                })
            }
            // 录入完成，渲染表格 + 统计人数
            renderTable();
        }

        // 渲染表格函数
        function renderTable(){
            // 每次渲染清空旧内容
            box.innerHTML = "";

            // 统计三类人数
            let count1 = 0, count2 = 0, count3 = 0;
            for(let i=0; i<workList.length; i++){
                if(workList[i].level === "初级创作者") count1++;
                if(workList[i].level === "进阶创作者") count2++;
                if(workList[i].level === "资深创作者") count3++;
            }
            // 输出统计文字
            box.innerHTML += `<p>统计：初级${count1}人，进阶${count2}人，资深${count3}人</p>`

            // 创建表格
            let tab = document.createElement('table');
            // 表头
            let trHead = document.createElement('tr');
            trHead.innerHTML = `<th>姓名</th><th>年龄</th><th>作品名称</th><th>创作者等级</th>`
            tab.appendChild(trHead);

            // 循环数组生成每一行数据
            for(let i=0; i<workList.length; i++){
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${workList[i].name}</td>
                    <td>${workList[i].age}</td>
                    <td>${workList[i].title}</td>
                    <td>${workList[i].level}</td>
                `
                tab.appendChild(tr);
            }
            box.appendChild(tab);
        }
    </script>
</body>
</html>
