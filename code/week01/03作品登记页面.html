<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09whl_作品登记页面</title>
</head>
<body>
    <!-- 舍弃弹出窗口，在页面上直接输入 -->
        姓名:<input id="name"></input>
        <!-- 换行 -->
         <br></br>
        年龄:<input id="age"></input>
        <br></br>
        手机号:<input id="phoneNumber"></input>
        <br></br>
        作品名称:<input id="workName"></input>
        <br></br>
        创作时间:<input id="date"></input>
        <br></br>
        <button id="btn">提交</button>
        <br></br>
        <!-- 登记作品: 姓名、年龄、手机号、作品名称、创作时间 -->
        <div id="list"></div>
        
    <script>
        // 创建类，定义模版：登记人的规范
        class Person{
            // 构造函数
            constructor(name, age, phoneNumber, workName, date){
                this.name = name
                this.age = age
                this.phoneNumber = phoneNumber
                this.workName = workName
                this.date = date
            }
        }

        // 创建数组：收集数据的容器
        let arr = []
        // 在页面中找到 id 为 `btn` 的按钮，存到变量 `btn`
        let btn = document.getElementById('btn')
        btn.onclick = function(){ 
            // 获取数据
            let n = document.getElementById('name').value
            let a = document.getElementById('age').value
            let ph = document.getElementById('phoneNumber').value
            let w = document.getElementById('workName').value
            let d = document.getElementById('date').value
        

        // 使用模版，创建一条数据
        let p = new Person(n, a, ph, w, d)
        arr.push(p)

        // 输出数据到页面
        let str = ''
        for(let i=0;i<arr.length;i++){
        str += `姓名：${arr[i].name}, 年龄：${arr[i].age}岁，手机号：${arr[i].phoneNumber}，作品名称：《${arr[i].workName}》，创作时间：${arr[i].date}年 <br>`
    }
    document.getElementById("list").innerHTML = str;

    // ==========新增清空输入框代码==========
        document.getElementById('name').value = "";
        document.getElementById('age').value = "";
        document.getElementById('phoneNumber').value = "";
        document.getElementById('workName').value = "";
        document.getElementById('date').value = "";
        }


        
    </script>
</body>
</html>
