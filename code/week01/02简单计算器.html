<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09王慧琳</title>
</head>
<body>
    <script>
        let num1 = + prompt("请输入第一个数字:")
        let num2 = + prompt("请输入第二个数字:")
        // 控制台输出
        console.log(num1 + num2)
        console.log(num1 - num2)
        // 在网页中输出
        document.write(num1 + num2)
        document.write("<br>")
        document.write(num1 - num2)
        document.write("<br>")
        document.write(num1 * num2)
        // 弹窗输出
        alert(num1 / num2)
    </script>
</body>
</html>
