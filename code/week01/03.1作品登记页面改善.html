<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09whl_作品登记页面</title>
    <style>
        .box{
            width: 500px;
            margin: 30px auto;
        }
        .item{
            margin:10px 0;
        }
        input{
            padding:6px;
            width:300px;
        }
        button{
            padding:8px 20px;
            cursor:pointer;
        }
        table{
            width:100%;
            margin-top:20px;
            border-collapse: collapse;
        }
        td,th{
            border:1px solid #999;
            padding:8px;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>作品登记</h2>
    <!-- 表单：页面直接输入，不再弹窗 -->
    <div class="item">
        姓名：<input type="text" id="name">
    </div>
    <div class="item">
        年龄：<input type="text" id="age">
    </div>
    <div class="item">
        手机号：<input type="text" id="phone">
    </div>
    <div class="item">
        作品名称：<input type="text" id="work">
    </div>
    <div class="item">
        创作年份：<input type="text" id="time">
    </div>
    <button id="addBtn">添加登记信息</button>

    <!-- 表格用来展示多条全部数据 -->
    <table id="tableList">
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>手机号</th>
            <th>作品名称</th>
            <th>创作时间</th>
        </tr>
    </table>
</div>

<script>
    // 数组：用来保存多条登记数据（可以存多个人）
    let dataList = [];

    // 获取按钮
    let addBtn = document.getElementById('addBtn');

    // 点击按钮添加一条记录
    addBtn.addEventListener('click',function(){
        // 获取输入框里面填写的内容
        let name = document.getElementById('name').value;
        let age = document.getElementById('age').value;
        let phone = document.getElementById('phone').value;
        let work = document.getElementById('work').value;
        let time = document.getElementById('time').value;

        // 把一条信息包装成对象，存入数组
        let info = {
            name: name,
            age: age,
            phone: phone,
            work: work,
            time: time
        }
        dataList.push(info);

        // 渲染刷新表格
        renderTable();

        // 添加完成清空输入框，方便录入下一个人
        document.getElementById('name').value = "";
        document.getElementById('age').value = "";
        document.getElementById('phone').value = "";
        document.getElementById('work').value = "";
        document.getElementById('time').value = "";
    })

    // 渲染表格函数：遍历数组，展示全部多条数据
    function renderTable(){
        let table = document.getElementById('tableList');
        // 保留表头，清空原来的数据行
        table.innerHTML = `
        <tr>
            <th>姓名</th>
            <th>年龄</th>
            <th>手机号</th>
            <th>作品名称</th>
            <th>创作时间</th>
        </tr>
        `
        // 循环数组，一条一条生成表格行
        for(let i = 0 ; i < dataList.length ; i++){
            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dataList[i].name}</td>
                <td>${dataList[i].age}</td>
                <td>${dataList[i].phone}</td>
                <td>《${dataList[i].work}》</td>
                <td>${dataList[i].time}年</td>
            `
            table.appendChild(row);
        }
    }
</script>
</body>
</html>
